name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]" pyinstaller

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) { throw "tag $tag does not match project version $version" }

      - name: Lint, tests, checks
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m skill_gap_agent.m29_check
          python -m skill_gap_agent.m13_check
          python -m skill_gap_agent.m18_check
          python -m skill_gap_agent.m20_check
          node --check extension/sidepanel.js
          node --check extension/content.js
          if (Test-Path data/skillsdataset.json) {
            python -m skill_gap_agent.m26_check
          } else {
            Write-Host "Seed data not present: skipping the full m26 graph run."
          }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Prepare signing certificate
        env:
          SKILL_GAP_SIGN_PFX_BASE64: ${{ secrets.SKILL_GAP_SIGN_PFX_BASE64 }}
        run: |
          if ($env:SKILL_GAP_SIGN_PFX_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP "skill-gap-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SKILL_GAP_SIGN_PFX_BASE64))
            "SKILL_GAP_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Signing certificate prepared."
          } else {
            Write-Host "No signing certificate secret: unsigned test build."
          }

      - name: Build installer
        env:
          SKILL_GAP_SIGN_PASSWORD: ${{ secrets.SKILL_GAP_SIGN_PASSWORD }}
          SKILL_GAP_STORE_URL: ${{ vars.SKILL_GAP_STORE_URL }}
        run: |
          .\packaging\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-gap-agent-windows
          path: |
            dist/SkillGapAgent-Setup.exe
            dist/SkillGapAgent-Setup.exe.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/SkillGapAgent-Setup.exe dist/SkillGapAgent-Setup.exe.sha256 --clobber
          } else {
            gh release create $tag dist/SkillGapAgent-Setup.exe dist/SkillGapAgent-Setup.exe.sha256 --title "Skill-Gap Agent $tag" --notes "Windows companion installer. See the README for the two-install setup."
          }
