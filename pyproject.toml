[project]
name = "skill-gap-agent"
version = "0.1.0"
description = "Transferability-aware skill-gap analysis agent: skills dump + JDs -> weighted skill graph -> ranked gap plan"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "keyring>=25.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
skill-gap = "skill_gap_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_gap_agent"]